services:
  db:
    image: postgres:15-alpine
    container_name: wallet_session_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-wallet_based_session}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_based_session"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: wallet_session_web
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/venv
    ports:
      - "8000:8000"
    environment:
      - DATABASE_NAME=${DATABASE_NAME:-wallet_based_session}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
